[package]
name = "fib-service"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
env_logger = "0.11.11"
log = "0.4.34"
num-bigint = { version = "0.5.1", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["full"] }
warp = { version = "0.4.3", features = ["server"] }
yaml_serde = "0.10.7"
